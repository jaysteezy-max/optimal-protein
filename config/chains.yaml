# The 20 chains in scope (top PNW fast food / fast casual).
#
# puller:
#   auto    — pull_nutrition.py has a fetcher for this chain (best-effort;
#             chain sites change without notice)
#   curated — nutrition maintained by hand in data/items.csv, optionally
#             refreshed from a hand-saved data/raw/nutrition/<slug>_curated.json
#
# nutrition_url is the official source of truth for protein/calories.
chains:
  - slug: chick-fil-a
    name: Chick-fil-A
    nutrition_url: https://www.chick-fil-a.com/menu
    puller: curated
  - slug: chipotle
    name: Chipotle
    nutrition_url: https://www.chipotle.com/nutrition-calculator
    puller: auto
  - slug: wendys
    name: Wendy's
    nutrition_url: https://www.wendys.com/nutrition-information
    puller: curated
