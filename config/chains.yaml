# Every vendor in scope: 26 PNW fast-food / fast-casual chains, plus the
# off-the-shelf retail brands that make up the second board.
#
# kind:
#   restaurant — a counter you order at. The default when omitted, so none of
#                the original 26 entries needed editing.
#   retail     — a product you buy off a grocery shelf.
#
# `kind` decides which BOARD an item lands on and, critically, which pool its
# score is normalized against. Restaurant and retail items are never scored
# against each other: retail beats restaurant food by 2-7x on all three terms
# at once, so a shared ruler would flatten the restaurant board (median score
# 44.1 -> 33.3) and re-create the exact failure Score v3 was written to fix.
# The raw per-50-g metrics stay directly comparable across boards; only the
# 0-100 score is pool-relative. See config/scoring.yaml.
#
# membership_required: true
#   The listed price needs a paid membership (Costco, ~$65/yr) that no other
#   row carries. Previously this caveat lived only in a YAML comment and in
#   free-text notes, so nothing downstream could act on it; it is now a real
#   field that drives a badge and a filter.
#
# puller:
#   auto    — pull_nutrition.py has a fetcher for this chain (best-effort;
#             chain sites change without notice)
#   curated — nutrition maintained by hand in data/items.csv, optionally
#             refreshed from a hand-saved data/raw/nutrition/<slug>_curated.json
#
# nutrition_url is the official source of truth for protein/calories.
chains:
  - slug: chick-fil-a
    name: Chick-fil-A
    nutrition_url: https://www.chick-fil-a.com/menu
    puller: curated
  - slug: chipotle
    name: Chipotle
    nutrition_url: https://www.chipotle.com/nutrition-calculator
    puller: auto
